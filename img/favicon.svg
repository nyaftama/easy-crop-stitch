<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565c0" />
      <stop offset="60%" stop-color="#0d47a1" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>

    <!-- Crop Frame Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect x="8" y="8" width="496" height="496" rx="116" ry="116" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="8" />

  <!-- Grid Stitching Icons (Background tiles) -->
  <g opacity="0.35" fill="none" stroke="#ffffff" stroke-width="4">
    <rect x="76" y="76" width="160" height="160" rx="16" />
    <rect x="276" y="76" width="160" height="160" rx="16" />
    <rect x="76" y="276" width="160" height="160" rx="16" />
    <rect x="276" y="276" width="160" height="160" rx="16" />
  </g>

  <!-- Focused Center Crop Frame with Shadow -->
  <g filter="url(#boxShadow)">
    <!-- Crop Rect Outer Highlight -->
    <rect x="136" y="136" width="240" height="240" rx="20" fill="rgba(37, 99, 235, 0.25)" stroke="#ffffff" stroke-width="8" />
    
    <!-- Rule of thirds dashed lines -->
    <line x1="216" y1="136" x2="216" y2="376" stroke="rgba(255, 255, 255, 0.4)" stroke-width="3" stroke-dasharray="6,6" />
    <line x1="296" y1="136" x2="296" y2="376" stroke="rgba(255, 255, 255, 0.4)" stroke-width="3" stroke-dasharray="6,6" />
    <line x1="136" y1="216" x2="376" y2="216" stroke="rgba(255, 255, 255, 0.4)" stroke-width="3" stroke-dasharray="6,6" />
    <line x1="136" y1="296" x2="376" y2="296" stroke="rgba(255, 255, 255, 0.4)" stroke-width="3" stroke-dasharray="6,6" />

    <!-- Corner Crop Handles -->
    <!-- Top-Left -->
    <path d="M 120 160 L 120 120 L 160 120" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Top-Right -->
    <path d="M 352 120 L 392 120 L 392 160" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Bottom-Left -->
    <path d="M 120 352 L 120 392 L 160 392" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Bottom-Right -->
    <path d="M 352 392 L 392 392 L 392 352" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Crosshair Target -->
    <circle cx="256" cy="256" r="16" fill="#38bdf8" />
    <circle cx="256" cy="256" r="6" fill="#ffffff" />
  </g>
</svg>
