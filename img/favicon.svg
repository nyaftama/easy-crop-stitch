<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Vibrant Blue Solid Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="#1565c0" />

  <!-- Solid White Crop Frame with Stitched Grid Silhouette -->
  <!-- Outer Box -->
  <rect x="96" y="96" width="320" height="320" rx="40" fill="none" stroke="#ffffff" stroke-width="48" />

  <!-- Stitched Grid Divider Cross -->
  <line x1="256" y1="120" x2="256" y2="392" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />
  <line x1="120" y1="256" x2="392" y2="256" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />

  <!-- Center Focus Accent -->
  <circle cx="256" cy="256" r="32" fill="#38bdf8" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
</svg>